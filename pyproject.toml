[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds4-mapper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce",
    "pynput",
    "rich",
    "textual",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ds4-mapper = "ds4mapper.__main__:main"

[tool.setuptools.packages.find]
include = ["ds4mapper*"]

[tool.setuptools.package-data]
"ds4mapper" = ["profiles/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, isort

[tool.ruff.format]
quote-style = "double"
